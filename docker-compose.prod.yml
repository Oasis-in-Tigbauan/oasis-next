name: oasis-next-prod

services:
  # Main Services
  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - ./.data/db:/var/lib/postgresql
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USERNAME -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  cache:
    image: redis:latest
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
      NEXT_PUBLIC_PROJECT_ORG_NAME: ${NEXT_PUBLIC_PROJECT_ORG_NAME}
      NEXT_PUBLIC_PROJECT_ORG_SEAL: ${NEXT_PUBLIC_PROJECT_ORG_SEAL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      REDIS_URL: redis://cache:6379
      DATABASE_URL: postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
