name: oasis-next

services:
  # Main Services
  db:
    image: postgres:latest
    restart: unless-stopped
    expose:
      - 5432
    volumes:
      - ./.data/db:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - defaultNetwork
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USERNAME -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  cache:
    image: redis:latest
    restart: unless-stopped
    expose:
      - 6379
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - defaultNetwork
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  defaultNetwork:
    driver: bridge
