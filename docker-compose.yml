name: oasis-next

services:
  # Main Services
  db:
    image: postgres:latest
    restart: unless-stopped
    expose:
      - 5432
    ports:
      - "5432:5432"
    networks:
      - defaultNetwork
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  cache:
    image: redis:latest
    restart: unless-stopped
    expose:
      - 6379
    ports:
      - "6379:6379"
    networks:
      - defaultNetwork

networks:
  defaultNetwork:
    driver: bridge
